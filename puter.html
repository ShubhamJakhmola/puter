<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puter Image Bridge — Make.com Automation</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div id="app" class="wrap">
    <header class="manual-only">
      <span class="tag">Puter.js · Make.com Bridge</span>
      <h1>AI Image <span class="accent">Automation Bridge</span></h1>
      <p class="sub">
        Trigger via URL: <code>?prompt=…&amp;webhook=…&amp;count=4</code>.
        Uses <code>puter.ai.txt2img()</code> — no backend, no API key.
      </p>
    </header>

    <div id="headless-panel" class="headless-ui" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="headless-status">Initializing…</p>
    </div>

    <div id="preview-panel" class="manual-only">
      <div class="card">
        <h2>Manual Test</h2>
        <label for="manual-prompt">Prompt</label>
        <textarea id="manual-prompt" placeholder="A red rose on marble, studio lighting"></textarea>
        <div class="row">
          <div class="field">
            <label for="manual-model">Model</label>
            <select id="manual-model">
              <option value="gpt-image-1-mini">gpt-image-1-mini</option>
              <option value="gpt-image-1">gpt-image-1</option>
              <option value="gpt-image-1.5">gpt-image-1.5</option>
              <option value="gpt-image-2">gpt-image-2</option>
            </select>
          </div>
          <div class="field">
            <label for="manual-quality">Quality</label>
            <select id="manual-quality">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </div>
          <div class="field">
            <label for="manual-count">Count</label>
            <input type="number" id="manual-count" min="1" max="10" value="1">
          </div>
          <div class="field">
            <label for="manual-test">Test mode</label>
            <select id="manual-test">
              <option value="false">live</option>
              <option value="true">test (free sample)</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn" id="manual-generate">Generate</button>
          <span class="status-pill" id="manual-status">Idle</span>
        </div>
      </div>
    </div>

    <div id="result-panel" hidden>
      <div class="card">
        <h2>Result</h2>
        <div class="btn-row">
          <span class="status-pill" id="result-status">—</span>
          <button class="btn btn-ghost manual-only" id="copy-json">Copy JSON</button>
        </div>
        <div class="meta-grid" id="meta-grid"></div>
        <div id="error-box" hidden></div>
        <div class="gallery" id="gallery"></div>
        <div class="json-box manual-only" id="json-output" hidden></div>
      </div>
    </div>

    <div class="card manual-only" id="history-panel">
      <h2>Recent Generations</h2>
      <div class="history-list" id="history-list">
        <p class="sub" style="margin:0;">No history yet.</p>
      </div>
    </div>

    <footer class="manual-only">
      <span>Puter Image Bridge · production automation</span>
      <a href="https://developer.puter.com" target="_blank" rel="noopener">Powered by Puter →</a>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
